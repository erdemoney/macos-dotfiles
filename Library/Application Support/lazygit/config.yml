# Custom commands sourced from:
# https://github.com/jesseduffield/lazygit/wiki/Custom-Commands-Compendium
customCommands:
  # Blame via tig (https://jonas.github.io/tig/)
  - key: b
    command: tig blame -- {{.SelectedFile.Name}}
    context: files
    description: blame file at tree
    output: terminal
  - key: b
    command: tig blame {{.SelectedSubCommit.Hash}} -- {{.SelectedCommitFile.Name}}
    context: commitFiles
    description: blame file at revision
    output: terminal
  - key: B
    command: tig blame -- {{.SelectedCommitFile.Name}}
    context: commitFiles
    description: blame file at tree
    output: terminal
  # File history via tig (https://jonas.github.io/tig/)
  - key: t
    command: tig {{.SelectedSubCommit.Hash}} -- {{.SelectedCommitFile.Name}}
    context: commitFiles
    description: tig file (history of commits affecting file)
    output: terminal
  - key: t
    command: tig -- {{.SelectedFile.Name}}
    context: files
    description: tig file (history of commits affecting file)
    output: terminal
  # Committing via Commitizen (https://commitizen-tools.github.io/commitizen/)
  - key: "C"
    command: "git cz c"
    context: files
    description: commit with commitizen
    loadingText: opening commitizen commit tool
    output: terminal
  # Opening git mergetool
  - key: "M"
    command: "git mergetool {{ .SelectedFile.Name }}"
    context: files
    description: open git mergetool
    loadingText: opening git mergetool
    output: terminal
