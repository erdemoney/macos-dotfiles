theme = "base16_transparent_soft"

[editor]
bufferline = "multiple"
mouse = true
color-modes = true
rainbow-brackets = true
popup-border = "all"
gutters = [
  "diagnostics",
  "spacer",
  "line-numbers",
  "spacer",
  "diff",
  "code-action-hint",
]

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]

"C-h" = "swap_view_left"
"C-j" = "swap_view_down"
"C-k" = "swap_view_up"
"C-l" = "swap_view_right"

# ","  = tools leader. Free namespace: no zellij, ghostty, or Helix collisions.
[keys.normal.","]
# e - recent files
e = ":recentf-open-files"

[keys.normal.space]
x = ":buffer-close"
X = ":buffer-close!"
B = ":sh blame %{buffer_name} %{cursor_line}"

[editor.lsp]
# ty and tinymist both provide inlay hints (verified via LSP capabilities).
display-inlay-hints = true
inlay-hints-length-limit = 25
auto-document-highlight = true

[editor.inline-diagnostics]
# You now have many diagnostic sources; render them under the cursor line
# instead of only at end-of-line.
cursor-line = "hint"
other-lines = "error"

[editor.file-picker]
# You edit dotfiles often (~/.config/helix, ~/.zshrc). Default hides them.
hidden = false

[editor.statusline]
right = [
  "diagnostics",
  "workspace-diagnostics",
  "selections",
  "position",
  "version-control",
  "file-encoding",
]
